name: Build and Release Module

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual one-click trigger from the Actions tab

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Read version from module.json
      - name: Read Version from module.json
        id: get_version
        run: echo "version=$(node -p 'require("./module.json").version')" >> "$GITHUB_OUTPUT"

      # Zips the module files into a consistent release asset
      - name: Zip Files
        run: zip -r module.zip module.json lang/ scripts/ styles/ templates/ README.md

      # Publishes to GitHub Releases
      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: Version ${{ steps.get_version.outputs.version }}
          artifacts: "module.zip"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}