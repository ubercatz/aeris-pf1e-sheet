name: Build and Release Module

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Reads the version directly from your module.json
      - name: Read Version from module.json
        run: echo "VERSION=$(node -p "require('./module.json').version")" >> $GITHUB_ENV

      # Zips the new folder structure instead of the old dist/ folder
      - name: Zip Files
        run: zip -r module-v${{ env.VERSION }}.zip module.json lang/ scripts/ styles/ templates/ README.md

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: Version ${{ env.VERSION }}
          artifacts: "module-v${{ env.VERSION }}.zip"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}