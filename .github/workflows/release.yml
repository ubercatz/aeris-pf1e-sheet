name: Build and Release Module

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Read Version from module.json
        run: echo "VERSION=$(node -p "require('./module.json').version")" >> $GITHUB_ENV

      - name: Zip Files
        run: zip -r module-v${{ env.VERSION }}.zip module.json dist/

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: Version ${{ env.VERSION }}
          artifacts: "module-v${{ env.VERSION }}.zip"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}